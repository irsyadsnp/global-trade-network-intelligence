[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-trade-network-intelligence"
version = "0.1.0"
description = "Reproducible analysis of global trade and inter-country production networks."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Irsyad Fariz Sena Pratama" }
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "requests>=2.31"
]

[project.optional-dependencies]
network = [
  "networkx>=3.2",
  "python-igraph>=0.11"
]
statistics = [
  "statsmodels>=0.14",
  "scikit-learn>=1.4"
]
notebooks = [
  "jupyterlab>=4.1",
  "ipykernel>=6.29",
  "pyarrow>=15.0"
]
dev = [
  "pytest>=8.0",
  "ruff>=0.3"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
